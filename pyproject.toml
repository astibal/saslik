[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saslik"
version = "0.2.0"
description = "A tiny graphical launcher for a Smithproxy, Spider and Sift lab"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Smithproxy project" }]
dependencies = []

[project.scripts]
saslik = "saslik.cli:main"
saslik-routing = "saslik.routing:main"
saslik-ca = "saslik.ca:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saslik"]

[tool.hatch.build.targets.wheel.force-include]
"src/saslik/web" = "saslik/web"
